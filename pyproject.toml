[project]
name = "glimpsely"
version = "0.1.0"
description = "Screenshot-forwarding personal memory assistant on local multimodal LLM"
requires-python = ">=3.10"
dependencies = [
    "wechat-ilink-bot>=0.1.0",
    "apscheduler>=3.11",
    "httpx>=0.27",
    "pillow>=12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
