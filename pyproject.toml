[project]
name = "glimpsely"
version = "0.1.0"
description = "Screenshot-forwarding personal memory assistant on local multimodal LLM"
requires-python = ">=3.10"
dependencies = [
    "wechat-ilink-bot>=0.1.0",
    "apscheduler>=3.11",
    "httpx>=0.27",
    "pillow>=12.0",
    "sherpa-onnx>=1.13",   # pip 需官方源: pip install -i https://pypi.org/simple sherpa-onnx
    "pilk>=0.2",           # 微信语音 silk 解码
    "sqlite-vec>=0.1",
    "paddlepaddle>=3.0",
    "paddleocr>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
